name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step. An install is a second thing that can differ between the machine
      # that reviewed a release and the machine that runs it.
      - name: Test
        run: npm test
